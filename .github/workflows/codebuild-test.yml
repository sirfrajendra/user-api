
name: RemitOS CodeBuild Runner Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  runner-test:
    runs-on:
      - codebuild-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CodeBuild runner
        run: |
          echo "Hello from AWS CodeBuild!"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Runner: $RUNNER_NAME"

      - name: Verify AWS identity
        run: aws sts get-caller-identity
  
      
      - name: Test SSM connection to EC2
        shell: bash
        run: |
          INSTANCE_ID="i-04b24da830b29a3f5"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["echo SSM connection successful","hostname","whoami"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS=""

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              break
            fi

            sleep 2
          done

          echo "SSM Status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json

          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM command did not succeed."
            exit 1
          fi

      
      - name: Prepare EC2 deployment directory
        shell: bash
        run: |
          INSTANCE_ID="i-04b24da830b29a3f5"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["id remitos >/dev/null 2>&1 || useradd --system --create-home --home-dir /opt/remitos-api --shell /usr/sbin/nologin remitos","install -d -o remitos -g remitos /opt/remitos-api/releases /opt/remitos-api/shared","chown -R remitos:remitos /opt/remitos-api","ls -ld /opt/remitos-api /opt/remitos-api/releases /opt/remitos-api/shared"]}' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
