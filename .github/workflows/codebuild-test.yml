
name: RemitOS CodeBuild Runner Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  runner-test:
    runs-on:
      - codebuild-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS application
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking NestJS build..."
          test -f dist/src/main.js
          echo "Build successful!"
          ls -la dist/src/


      - name: Package application
        shell: bash
        run: |
          ARTIFACT="user-api-${GITHUB_SHA}.tar.gz"

          tar -czf "$ARTIFACT" \
            dist/src \
            package.json \
            package-lock.json \
            .npmrc

          echo "Deployment package created:"
          ls -lh "$ARTIFACT"

          echo "Verifying package contents:"
          tar -tzf "$ARTIFACT"

      - name: Upload deployment artifact to S3
        shell: bash
        run: |
          BUCKET="remitos-test-deploy-970478134604-us-east-2"
          ARTIFACT="user-api-${GITHUB_SHA}.tar.gz"

          aws s3 cp "$ARTIFACT" \
            "s3://${BUCKET}/releases/${ARTIFACT}" \
            --region us-east-2

          echo "Deployment artifact uploaded successfully."

      
      - name: Download deployment artifact onto EC2
        shell: bash
        run: |
          BUCKET="remitos-test-deploy-970478134604-us-east-2"
          INSTANCE_ID="i-04b24da830b29a3f5"
          ARTIFACT="user-api-${GITHUB_SHA}.tar.gz"
          DEST="/opt/remitos-api/shared"

          COMMAND_ID=$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://${BUCKET}/releases/${ARTIFACT} ${DEST}/${ARTIFACT} --region us-east-2\",\"chown remitos:remitos ${DEST}/${ARTIFACT}\",\"ls -lh ${DEST}/${ARTIFACT}\",\"tar -tzf ${DEST}/${ARTIFACT} | head -20\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region us-east-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --region us-east-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json



      - name: Verify CodeBuild runner
        run: |
          echo "Hello from AWS CodeBuild!"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Runner: $RUNNER_NAME"

      - name: Verify AWS identity
        run: aws sts get-caller-identity
  
      
      - name: Test SSM connection to EC2
        shell: bash
        run: |
          INSTANCE_ID="i-04b24da830b29a3f5"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["echo SSM connection successful","hostname","whoami"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS=""

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              break
            fi

            sleep 2
          done

          echo "SSM Status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json

          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM command did not succeed."
            exit 1
          fi

      
      - name: Prepare EC2 deployment directory
        shell: bash
        run: |
          INSTANCE_ID="i-04b24da830b29a3f5"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["id remitos >/dev/null 2>&1 || useradd --system --create-home --home-dir /opt/remitos-api --shell /usr/sbin/nologin remitos","install -d -o remitos -g remitos /opt/remitos-api/releases /opt/remitos-api/shared","chown -R remitos:remitos /opt/remitos-api","ls -ld /opt/remitos-api /opt/remitos-api/releases /opt/remitos-api/shared"]}' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
      

      - name: Install AWS CLI on EC2
        shell: bash
        run: |
          INSTANCE_ID="i-04b24da830b29a3f5"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["apt-get update","apt-get install -y curl unzip","curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip","unzip -qo /tmp/awscliv2.zip -d /tmp","/tmp/aws/install","aws --version"]}' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

      
      - name: Test S3 transfer from CodeBuild to EC2
        shell: bash
        run: |
          BUCKET="remitos-test-deploy-970478134604-us-east-2"
          INSTANCE_ID="i-04b24da830b29a3f5"
          KEY="test/hello.txt"

          # Create a test artifact
          echo "Hello from CodeBuild to EC2 through S3!" > /tmp/hello.txt

          # Upload from CodeBuild
          aws s3 cp /tmp/hello.txt "s3://$BUCKET/$KEY" \
            --region us-east-2

          echo "Upload successful"

          # Ask EC2 to download and display the file
          COMMAND_ID=$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"aws s3 cp s3://$BUCKET/$KEY /tmp/hello.txt --region us-east-2\",\"cat /tmp/hello.txt\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region us-east-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --region us-east-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
